/* Scoring: start at 5. Each answer adds its delta minus the average delta of the four options,
   so picking the low choice actually lowers that trait. Raw sums in the question list are
   almost all positive; without this, every result collapses toward the high-social animals.
   Then clamp 0–10 and take the nearest animal by squared Euclidean distance.
   Exact distance ties prefer the animal whose story dim matches the user's highest dim. */
function scoreUser(answers){
  const u={};
  DIM_IDS.forEach(d=>u[d]=5);
  Q.forEach((q,i)=>{
    const opt=q.o[answers[i]];
    if(!opt) return;
    DIM_IDS.forEach(d=>{
      let s=0;
      q.o.forEach(o=>{s+=(o[1][d]||0)});
      const mean=s/q.o.length;
      u[d]+=((opt[1][d]||0)-mean);
    });
  });
  DIM_IDS.forEach(d=>{u[d]=Math.max(0,Math.min(10,u[d]))});
  return u;
}
function dist2(u,ideal){let d=0;DIM_IDS.forEach(k=>{d+=(u[k]-ideal[k])**2});return d}
function userTopDim(u){
  let best=DIM_IDS[0],bv=-Infinity;
  DIM_IDS.forEach(d=>{if(u[d]>bv+1e-9){bv=u[d];best=d}});
  return best;
}
function rankAnimals(u){
  const top=userTopDim(u);
  return ANIMALS.map(a=>({a,d:dist2(u,a.ideal)})).sort((x,y)=>{
    const dd=x.d-y.d;
    if(Math.abs(dd)>1e-6) return dd;
    return (x.a.dom===top?0:1)-(y.a.dom===top?0:1);
  });
}
function compute(){
  userDims=scoreUser(ans);
  const ranked=rankAnimals(userDims);
  res=ranked[0].a;
  const bd=ranked[0].d;
  pct=Math.max(76,Math.min(98,Math.round(98-Math.sqrt(bd)*3.2)));
  others=ranked.slice(1,4).map(x=>x.a);
}

const FONT='"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif';
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrapT(c,t,mw){const o=[];let l='';for(const ch of t){if(c.measureText(l+ch).width>mw&&l){o.push(l);l=ch}else l+=ch}if(l)o.push(l);return o}
function buildShare(){
  const c=res,W=1080,P=72,CW=W-P*2;
  const cv=document.createElement('canvas'),x=cv.getContext('2d');
  function T(t,tx,ty,s,col,wt,al){x.font=`${wt||400} ${s}px ${FONT}`;x.fillStyle=col;x.textAlign=al||'left';x.textBaseline='top';x.fillText(t,tx,ty)}
  function box(y,h){x.fillStyle='#fff';rr(x,P,y,CW,h,40);x.fill();x.strokeStyle='#E8D9C8';x.lineWidth=3;x.stroke()}
  function layout(draw){
    if(draw){const g=x.createLinearGradient(0,0,0,cv.height);g.addColorStop(0,'#FFF8F2');g.addColorStop(1,'#F3EBE0');x.fillStyle=g;x.fillRect(0,0,W,cv.height)}
    let y=64;
    if(draw) T('上辈子的我更像',W/2,y,40,'#4F7A62',600,'center');
    y+=78;
    const h1=860;
    if(draw){
      box(y,h1);
      x.beginPath();x.arc(W/2,y+250,170,0,Math.PI*2);x.fillStyle=c.bg;x.fill();
      x.font=`160px ${FONT}`;x.textAlign='center';x.textBaseline='middle';x.fillText(c.emoji,W/2,y+262);
      x.textBaseline='top';
    }
    let cy=y+460;
    if(draw){
      T(pct+'%',W/2,cy,120,'#4F7A62',700,'center');
      T(c.name,W/2,cy+140,76,'#4A3F35',700,'center');
      T(c.tagline,W/2,cy+236,34,'#7A6E64',400,'center');
    }
    x.font=`500 34px ${FONT}`;
    const tw=c.tags.map(t=>x.measureText(t).width+56);
    const tot=tw.reduce((a,b)=>a+b,0)+18*(tw.length-1);
    let tx=(W-tot)/2;
    const tagY=y+h1-130;
    if(draw){
      c.tags.forEach((t,i)=>{x.fillStyle='#F8E8E4';rr(x,tx,tagY,tw[i],64,32);x.fill();T(t,tx+tw[i]/2,tagY+14,32,'#C48478',600,'center');tx+=tw[i]+18});
    }
    y+=h1+32;
    x.font=`400 34px ${FONT}`;
    const wl=wrapT(x,c.traits[0],CW-96);
    const h2=150+wl.length*52;
    if(draw){box(y,h2);T('灵魂特征',P+48,y+40,40,'#4A3F35',700);wl.forEach((l,i)=>T(l,P+48,y+110+i*52,34,'#7A6E64'))}
    y+=h2+32;
    x.font=`500 36px ${FONT}`;
    const line=wrapT(x,'「'+c.lines[0]+'」',CW-120);
    const h3=120+line.length*52;
    if(draw){
      box(y,h3);
      x.fillStyle='#F4F8F4';rr(x,P+40,y+36,CW-80,h3-72,24);x.fill();
      line.forEach((l,i)=>T(l,W/2,y+56+i*52,36,'#4A3F35',500,'center'));
    }
    y+=h3+48;
    if(draw){
      T('上辈子是什么动物',W/2,y,42,'#4A3F35',700,'center');
      T(URL_,W/2,y+64,28,'#4F7A62',500,'center');
      T(DISCLAIMER,W/2,y+112,24,'#B7A99C',400,'center');
    }
    return y+160;
  }
  cv.width=W;cv.height=10;
  const H=layout(false);
  cv.width=W;cv.height=H;
  layout(true);
  return cv.toDataURL('image/png');
}

async function mantleFetch(url,opts){
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),12000);
  try{
    return await fetch(url,Object.assign({},opts,{signal:ctl.signal}));
  }finally{clearTimeout(timer)}
}
async function mantleGet(code){
  const r=await mantleFetch(MANTLE_BASE+'/'+MANTLE_COL+'/'+encodeURIComponent(code),{headers:{'X-Mantle-Key':MANTLE_KEY}});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('net '+r.status);
  return r.json();
}
async function mantleDecr(code){
  const r=await mantleFetch('https://mantledb.sh/v2/increment/'+MANTLE_NS+'/'+MANTLE_COL+'/'+encodeURIComponent(code),{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Mantle-Key':MANTLE_KEY},
    body:JSON.stringify({key:'remaining',by:-1})
  });
  if(!r.ok) throw new Error('net '+r.status);
  return r.json();
}
async function mantleIncr(code){
  try{
    await mantleFetch('https://mantledb.sh/v2/increment/'+MANTLE_NS+'/'+MANTLE_COL+'/'+encodeURIComponent(code),{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Mantle-Key':MANTLE_KEY},
      body:JSON.stringify({key:'remaining',by:1})
    });
  }catch(e){}
}
async function redeemCode(code){
  const data=await mantleGet(code);
  if(!data||typeof data.remaining!=='number') return {ok:false,reason:'invalid'};
  if(data.remaining<=0) return {ok:false,reason:'exhausted'};
  const after=await mantleDecr(code);
  const left=typeof after.remaining==='number'?after.remaining:-1;
  if(left<0){
    await mantleIncr(code);
    return {ok:false,reason:'exhausted'};
  }
  return {ok:true,remaining:left,max:data.max||3};
}
async function tryUnlock(fromUrl){
  const code=normalizeCode($('codeInput').value);
  if(!code){if(!fromUrl) toast('请输入验证码');return false}
  if(!CODE_RE.test(code)){if(!fromUrl) toast('验证码不正确');return false}
  setCodeBusy(true);
  try{
    const out=await redeemCode(code);
    if(out.ok){
      setUnlocked(code);
      const left=out.remaining;
      toast(left>0?('验证成功，还可以测 '+left+' 次'):'验证成功，这是本码最后一次');

    }

    }
    return false;
  }catch(e){
    console.error(e);
    if(!fromUrl) toast('网络异常，请稍后重试');
    return false;
  }finally{
    setCodeBusy(false);
  }
}

$('btnStart').onclick=()=>{
  if(isUnlocked()){startQuiz();return}
  openCodeModal();
};
$('btnLast').onclick=()=>showLast();
$('btnCodeOk').onclick=()=>tryUnlock(false);
$('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter') tryUnlock(false)});
$('codeInput').addEventListener('input',()=>{
  const el=$('codeInput');
  const v=el.value.toUpperCase();
  if(v!==el.value){
    const p=el.selectionStart;
    el.value=v;
    try{el.setSelectionRange(p,p)}catch(e){}
  }
});
$('codeClose').onclick=closeCodeModal;
$('codeMask').addEventListener('click',e=>{if(e.target===$('codeMask')) closeCodeModal()});
$('qback').onclick=()=>{if(qi>0&&!picking){qi--;renderQ()}};
$('btnRetry').onclick=()=>{
  let pre='';
  try{pre=sessionStorage.getItem(ACCESS_CODE_KEY)||''}catch(e){}
  clearUnlock();
  openCodeModal(pre);
};
$('btnCopy').onclick=copyText;
$('btnImg').onclick=showShare;
$('btnClose').onclick=()=>$('ov').classList.remove('show');
$('btnDl').onclick=()=>{
  const a=document.createElement('a');
  a.href=window.__shareUrl;
  a.download='上辈子是'+(res?res.name:'动物')+'.png';
  document.body.appendChild(a);a.click();a.remove();
};
refreshLastBtn();
(function(){
  try{
    const p=new URLSearchParams(location.search).get('code');
    if(p==null||p==='') return;
    if(isUnlocked()) return;
    $('codeInput').value=normalizeCode(p);
    openCodeModal($('codeInput').value);
    tryUnlock(true);
  }catch(e){}
})();
</script>
</body>
</html>
