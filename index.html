/* Scoring: start at 5. Each answer adds its delta minus the average of the four options,
   so a low choice actually lowers that trait. Then clamp 0–10 and pick the nearest animal
   by squared Euclidean distance. Exact ties prefer the animal whose story dim matches
   the user's highest dim. */
function scoreUser(answers){
  const u={};
  DIM_IDS.forEach(d=>u[d]=5);
  Q.forEach((q,i)=>{
    const opt=q.o[answers[i]];
    if(!opt) return;
    DIM_IDS.forEach(d=>{
      let s=0;
      q.o.forEach(o=>{s+=(o[1][d]||0)});
      u[d]+=((opt[1][d]||0)-s/q.o.length);
    });
  });
  DIM_IDS.forEach(d=>{u[d]=Math.max(0,Math.min(10,u[d]))});
  return u;
}
function dist2(u,ideal){let d=0;DIM_IDS.forEach(k=>{d+=(u[k]-ideal[k])**2});return d}
function userTopDim(u){
  let best=DIM_IDS[0],bv=-Infinity;
  DIM_IDS.forEach(d=>{if(u[d]>bv+1e-9){bv=u[d];best=d}});
  return best;
}
function rankAnimals(u){
  const top=userTopDim(u);
  return ANIMALS.map(a=>({a,d:dist2(u,a.ideal)})).sort((x,y)=>{
    const dd=x.d-y.d;
    if(Math.abs(dd)>1e-6) return dd;
    return (x.a.dom===top?0:1)-(y.a.dom===top?0:1);
  });
}
function compute(){
  userDims=scoreUser(ans);
  const ranked=rankAnimals(userDims);
  res=ranked[0].a;
  pct=Math.max(76,Math.min(98,Math.round(98-Math.sqrt(ranked[0].d)*3.2)));
}

  rr(x,-150,-150,300,300,62); x.fillStyle=c.bg; x.fill();
  x.font=`168px ${EMOJI_FONT}`;
  x.textAlign='center'; x.textBaseline='middle';
  x.fillText(c.emoji,0,10);
  x.restore();
  T('我上辈子是',W/2,760,42,'#4F7A62',600);
  T(c.name,W/2,830,112,'#4A3F35',700);
  T(c.title,W/2,970,40,'#C48478',600);
  x.font=`600 36px ${FONT}`;
  const tw=c.tags.map(t=>x.measureText(t).width+64);
  const gap=18, tot=tw.reduce((a,b)=>a+b,0)+gap*(tw.length-1);
  let tx=(W-tot)/2; const ty=1088;
  c.tags.forEach((t,i)=>{
    x.fillStyle='#F8E8E4'; rr(x,tx,ty,tw[i],76,38); x.fill();
    T(t,tx+tw[i]/2,ty+18,36,'#C48478',600);
    tx+=tw[i]+gap;
  });
  x.font=`600 42px ${FONT}`;
  const lines=wrapT(x,'「'+c.letter+'」',820);
  const bh=lines.length*64+88, by=1248;
  x.fillStyle='#fffdf9'; rr(x,90,by,900,bh,40); x.fill();
  x.strokeStyle='#E6D5C3'; x.lineWidth=3; x.stroke();
  lines.forEach((l,i)=>T(l,W/2,by+44+i*64,42,'#4A3F35',600));
  const ctaY=by+bh+52;
  T('把结果报给朋友',W/2,ctaY,44,'#4A3F35',700);
  let urlSize=26;
  x.font=`500 ${urlSize}px ${FONT}`;
  while(x.measureText(URL_).width>940 && urlSize>16){urlSize-=1; x.font=`500 ${urlSize}px ${FONT}`;}
  T(URL_,W/2,ctaY+74,urlSize,'#4F7A62',500);
  T(FOOTER,W/2,ctaY+118,24,'#B7A99C',400);
  return cv.toDataURL('image/png');
}

const MANTLE_NS='catquiz-zph420-codes';
const MANTLE_COL='ap';
const MANTLE_KEY='f60c0dae2088e5ccd5061a110aef0c0ff2a5b85f2658e78809c9123c9d82a22c';
const MANTLE_BASE='https://mantledb.sh/v2/'+MANTLE_NS;
const ACCESS_KEY='animal_past_unlocked';
const ACCESS_CODE_KEY='animal_past_code';
const LAST_KEY='animal_past_last_result';

function isUnlocked(){try{return sessionStorage.getItem(ACCESS_KEY)==='1'}catch(e){return false}}
function setUnlocked(code){
  try{
    sessionStorage.setItem(ACCESS_KEY,'1');
    if(code) sessionStorage.setItem(ACCESS_CODE_KEY,code);
  }catch(e){}
}
function clearUnlock(){
  try{
    sessionStorage.removeItem(ACCESS_KEY);
    sessionStorage.removeItem(ACCESS_CODE_KEY);
  }catch(e){}
}
function normalizeCode(v){return String(v||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'')}
function openCodeModal(prefill){
  $('codeMask').classList.add('show');
  $('codeMask').setAttribute('aria-hidden','false');
  const inp=$('codeInput');
  if(prefill!=null) inp.value=prefill;
  setTimeout(()=>inp.focus(),50);
}
function closeCodeModal(){
  $('codeMask').classList.remove('show');
  $('codeMask').setAttribute('aria-hidden','true');
}
function startQuiz(){ans=[];qi=0;picking=false;closeCodeModal();show('quiz');renderQ()}
function setCodeBusy(busy){
  const btn=$('btnCodeOk');
  btn.disabled=!!busy;
  btn.textContent=busy?'验证中…':'开始答题';
}
function refreshLastBtn(){
  let has=false;
  try{has=!!localStorage.getItem(LAST_KEY)}catch(e){}
  $('btnLast').hidden=!has;
}
function saveLast(){
  try{localStorage.setItem(LAST_KEY,JSON.stringify({id:res.id,pct,dims:userDims,at:Date.now()}))}catch(e){}
  refreshLastBtn();
}
function showLast(){
  let data=null;
  try{data=JSON.parse(localStorage.getItem(LAST_KEY)||'null')}catch(e){data=null}
  if(!data||!data.id){toast('还没有上次结果');refreshLastBtn();return}
  const animal=byId(data.id);
  if(!animal){toast('上次结果已失效');return}
  res=animal;
  pct=typeof data.pct==='number'?data.pct:80;
  userDims=data.dims&&typeof data.dims==='object'?data.dims:Object.assign({},animal.ideal);
  renderR();
  show('result');
}
async function mantleFetch(url,opts){
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),12000);
  try{return await fetch(url,Object.assign({},opts,{signal:ctl.signal}))}
  finally{clearTimeout(timer)}
}
async function mantleGet(code){
  const r=await mantleFetch(MANTLE_BASE+'/'+MANTLE_COL+'/'+encodeURIComponent(code),{headers:{'X-Mantle-Key':MANTLE_KEY}});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('net '+r.status);
  return r.json();
}
async function mantleDecr(code){
  const r=await mantleFetch('https://mantledb.sh/v2/increment/'+MANTLE_NS+'/'+MANTLE_COL+'/'+encodeURIComponent(code),{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Mantle-Key':MANTLE_KEY},
    body:JSON.stringify({key:'remaining',by:-1})
  });
  if(!r.ok) throw new Error('net '+r.status);
  return r.json();
}
async function mantleIncr(code){
  try{
    await mantleFetch('https://mantledb.sh/v2/increment/'+MANTLE_NS+'/'+MANTLE_COL+'/'+encodeURIComponent(code),{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Mantle-Key':MANTLE_KEY},
      body:JSON.stringify({key:'remaining',by:1})
    });
  }catch(e){}
}
async function redeemCode(code){
  const data=await mantleGet(code);
  if(!data||typeof data.remaining!=='number') return {ok:false,reason:'invalid'};
  if(data.remaining<=0) return {ok:false,reason:'exhausted'};
  const after=await mantleDecr(code);
  const left=typeof after.remaining==='number'?after.remaining:-1;
  if(left<0){await mantleIncr(code);return {ok:false,reason:'exhausted'}}
  return {ok:true,remaining:left,max:data.max||3};
}
async function tryUnlock(fromUrl){
  const code=normalizeCode($('codeInput').value);
  if(!code){if(!fromUrl) toast('请输入验证码');return false}
  if(!CODE_RE.test(code)){if(!fromUrl) toast('验证码不正确');return false}
  setCodeBusy(true);
  try{
    const out=await redeemCode(code);
    if(out.ok){
      setUnlocked(code);
      const left=out.remaining;
      toast(left>0?('验证成功，还可以测 '+left+' 次'):'验证成功，这是本码最后一次');
      startQuiz();
      return true;
    }
    if(!fromUrl) toast(out.reason==='exhausted'?'此验证码已用完（每个码限 3 次）':'验证码不正确');
    return false;
  }catch(e){
    console.error(e);
    if(!fromUrl) toast('网络异常，请稍后重试');
    return false;
  }finally{setCodeBusy(false)}
}

$('btnStart').onclick=()=>{if(isUnlocked()){startQuiz();return} openCodeModal()};
$('btnLast').onclick=()=>showLast();
$('btnCodeOk').onclick=()=>tryUnlock(false);
$('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter') tryUnlock(false)});
$('codeInput').addEventListener('input',()=>{
  const el=$('codeInput');
  const v=el.value.toUpperCase();
  if(v!==el.value){const p=el.selectionStart; el.value=v; try{el.setSelectionRange(p,p)}catch(e){}}
});
$('codeClose').onclick=closeCodeModal;
$('codeMask').addEventListener('click',e=>{if(e.target===$('codeMask')) closeCodeModal()});
$('qback').onclick=()=>{if(qi>0&&!picking){qi--;renderQ()}};
$('btnRetry').onclick=()=>{
  let pre='';
  try{pre=sessionStorage.getItem(ACCESS_CODE_KEY)||''}catch(e){}
  clearUnlock();
  openCodeModal(pre);
};
$('btnCopy').onclick=copyText;
$('btnImg').onclick=showShare;
$('btnClose').onclick=()=>$('ov').classList.remove('show');
$('btnDl').onclick=()=>{
  const a=document.createElement('a');
  a.href=window.__shareUrl;
  a.download='我上辈子是'+(res?res.name:'动物')+'.png';
  document.body.appendChild(a); a.click(); a.remove();
};
refreshLastBtn();
(function(){
  try{
    const p=new URLSearchParams(location.search).get('code');
    if(p==null||p==='') return;
    if(isUnlocked()) return;
    $('codeInput').value=normalizeCode(p);
    openCodeModal($('codeInput').value);
    tryUnlock(true);
  }catch(e){}
})();
